# Taramandal orchestrator configuration.
#
# `tara up` reads this file for defaults; every value here can also be
# overridden with a CLI flag (see `tara up --help`).

[fleet]
# Default drone count when -n is not passed.
num_drones = 3
# "px4"  — real PX4 SITL + Gazebo. High fidelity, capped near 10 drones on a
#          12-core/30GB dev machine.
# "sim"  — vectorized kinematic simulator (packages/tara-sim). Scales to
#          hundreds of drones. Lands in Phase 2 of the finishing plan; `tara up`
#          reports a clear error if selected before it exists.
backend = "px4"

[px4]
# Path to your PX4-Autopilot checkout. Resolved in this order: the
# PX4_AUTOPILOT_DIR environment variable, this key, then ~/PX4-Autopilot.
# Prefer the env var for a machine-specific path so it stays out of git.
# autopilot_dir = "~/PX4-Autopilot"

[ports]
gcs_backend = 8090
gcs_web = 5173
studio_backend = 8001
studio_web = 5174

[services]
# Whether `tara up` also launches the ROS2/RViz TF bridge. Requires a display
# and a sourced ROS 2 install; off by default since most runs are headless.
rviz = false

[security]
# Public keys the GCS accepts show-file signatures from (issue #49). An upload
# to /api/upload-trajectory must carry a .sig.json manifest signed by one of
# these, or it is rejected with 403. `tara keygen` prints the line to add here;
# `tara sign` signs a show file. Remove a key to revoke it (restart the GCS).
# Unsigned legacy files are refused unless the stack is started with
# `tara up --allow-unsigned`.
trusted_keys = [
    # { signer = "Harsh (Studio laptop)", public_key = "base64 of the 32-byte Ed25519 public key" },
]

[studio]
# Private key the Studio backend signs its JSON/CSV exports and "Transmit to
# GCS" uploads with (issue #49), so the GCS's [security].trusted_keys accepts
# them. Create it with `tara keygen <path> --signer "<who>"`, which writes it
# owner-only; the Studio refuses a key other users can read. The key never
# leaves the Studio backend: the browser only sees its id. STUDIO_SIGNING_KEY
# overrides this. Unset: exports are unsigned.
# signing_key = "~/.config/taramandal/studio-signing.pem"

[safety]
# Pre-arm checklist profile the GCS enforces on /api/launch (issue #48):
#   "SIMULATION"  — sim/SITL fleets: 3D GPS fix and >= 50% charge; the rest is advisory.
#   "ENGINEERING" — bench testing: no RTK/GNSS or battery checks, single-drone
#                   launch allowed, EKF health bypassable by two-step override.
#   "FIELD_TEST"  — real hardware: RTK Float or Fixed, >= 80% charge, full fleet.
#   "PRODUCTION"  — commercial display: every gate blocking across 100% of the
#                   fleet, operator confirmation latch required, no overrides.
# TARA_OPERATIONAL_PROFILE overrides this. With no [safety] table at all the
# GCS falls back to PRODUCTION rather than guessing a looser profile.
operational_profile = "SIMULATION"
# Series cell count of the flight packs, used to derive per-cell voltage.
battery_cells = 4

[auth]
# Operator accounts and roles for the GCS API and dashboard (issue #64).
# Roles: "viewer" (telemetry), "choreographer" (upload/validate shows),
# "flight_commander" (arm, launch, abort). Manage accounts with
#   python -m tara_gcs.auth add <name> --role flight_commander
#   python -m tara_gcs.auth list | remove <name>
# The file holds scrypt hashes and must be owner-only (chmod 600); the GCS
# refuses to start with one others can read. GCS_OPERATORS_PATH overrides this.
# operators_file = "~/.config/taramandal/operators.json"
# Login sessions last this long and all end when the GCS restarts.
session_ttl_hours = 12
