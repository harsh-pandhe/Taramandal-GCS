# Taramandal monorepo root.
#
# The Python packages use a src-style layout (packages/<name>/<import_name>/),
# so `pythonpath` below is what lets `import tara_gcs` / `import tara_studio`
# resolve from a plain `pytest` at the repo root without any install step.

[tool.pytest.ini_options]
testpaths = [
    "packages/tara-core/tests",
    "packages/tara-gcs/tests",
    "packages/tara-sim/tests",
    "packages/tara-studio/tests",
    "apps/tara/tests",
]
pythonpath = [
    "packages/tara-core",
    "packages/tara-gcs",
    "packages/tara-sim",
    "packages/tara-studio",
    "apps",
    "apps/tara",
]
# Each package has its own tests/ directory. Under the default import mode those
# all resolve to a single `tests` package name and shadow each other, so use
# importlib mode — it keys modules by file path and needs no __init__.py markers.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: exercises the real (unshortened) production code path at a scale that takes real wall-clock time by design — e.g. the N=100 sim-backend milestone test, which honestly pays launch_sequence's intentional 1s per-drone stagger rather than special-casing it away. Excluded from a quick loop with `-m 'not slow'`; included by default.",
]

# Lint/type gates for CI (issue #66). Deliberately the minimal rule set —
# pyflakes plus pycodestyle's syntax/statement errors — so turning the gate on
# didn't turn into a repo-wide cleanup. Widen `select` in follow-up PRs.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# scipy ships no type stubs; don't fail tara-core on third-party imports.
ignore_missing_imports = true
