name: Taramandal Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (Fast Path)
        run: |
          pytest -p asyncio -m "not slow"

  test-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build tara-web (GCS)
        working-directory: packages/tara-web
        run: |
          npm ci
          npm run build

      - name: Build tara-studio-web (Studio)
        working-directory: packages/tara-studio-web
        run: |
          npm ci
          npm run build

  test-e2e:
    name: Playwright E2E (tara-web)
    runs-on: ubuntu-latest
    # The same image `npm run test:e2e:docker` uses, so the committed -linux
    # snapshot baselines were rendered by exactly this browser build and GL
    # stack. The tag must match @playwright/test in tara-web's package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: packages/tara-web
        run: npm ci

      - name: Run Playwright
        working-directory: packages/tara-web
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/tara-web/test-results/
          retention-days: 7
