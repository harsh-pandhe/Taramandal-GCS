# Automated quality gates (issue #66). Independent jobs so a red X says
# which gate broke: lint/types, Python tests, frontend tests, the 100-drone
# safety regression, or the Playwright visual/E2E suite. All must pass for
# a PR to merge.
#
# Not run here: apps/tara/tests/test_up_down_lifecycle.py (marked `slow`). It
# launches `tara up` through config.venv_python, which hardcodes
# <repo>/.venv/bin/python — a path a setup-python runner doesn't have, so the
# test errors rather than skipping. Tracked in #46.
#
# Each job's actual gate now runs through scripts/ci-gates/<job>.sh (#106) —
# the same scripts `./scripts/ci` runs locally — rather than duplicating the
# commands inline here. This file's job is only to set up each gate's
# environment (checkout, interpreter/runtime versions, dependency install)
# the way a GitHub-hosted runner needs to; the gate itself lives in one
# place. See docs/local-ci.md.

name: Taramandal Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ruff, mypy, and oxlint (both frontends, each with its own npm ci) —
      # see scripts/ci-gates/lint-and-typecheck.sh for the exact commands.
      - name: Lint & Typecheck
        run: ./scripts/ci-gates/lint-and-typecheck.sh

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The `slow` tests are covered elsewhere: the 100-drone show runs in the
      # scale-regression job below, and the lifecycle test is excluded (see the
      # note at the top of this file). See scripts/ci-gates/python-tests.sh.
      - name: Pytest (all packages, fast path)
        run: ./scripts/ci-gates/python-tests.sh

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tara-studio-web (Vitest + build), tara-web (build), Playwright
      # Chromium install, and the E2E run minus visual regression (that
      # subset runs in test-e2e below, against the pinned Docker image the
      # committed -linux baselines were rendered by — a plain chromium
      # install here would diff against the wrong browser build). See
      # scripts/ci-gates/frontend-tests.sh for the exact commands.
      - name: Frontend Tests
        run: ./scripts/ci-gates/frontend-tests.sh

  scale-regression:
    name: Scale Regression (100 drones)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Flies 100 drones through the real DroneManager sim backend and fails on
      # any proximity or geofence breach. tools/benchmark_fleet_scale.py is not
      # used: it reports breaches but always exits 0. See
      # scripts/ci-gates/scale-regression.sh.
      - name: 100-drone show, zero safety breaches
        run: ./scripts/ci-gates/scale-regression.sh

  test-e2e:
    name: Playwright E2E (tara-web)
    runs-on: ubuntu-latest
    # The same image `npm run test:e2e:docker` uses, so the committed -linux
    # snapshot baselines were rendered by exactly this browser build and GL
    # stack. The tag must match @playwright/test in tara-web's package-lock.json.
    #
    # This job's steps are intentionally NOT routed through
    # scripts/ci-gates/test-e2e.sh: that script's job is to get a host shell
    # *into* this same pinned image via `docker run` (see
    # packages/tara-web/e2e/run-in-docker.mjs) — this job is already
    # natively inside it via the container: directive below, so the two
    # `npm ci` / `npm run test:e2e` lines here are the same underlying
    # commands the Docker script runs once inside the container, reached a
    # different way rather than duplicated logic.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: packages/tara-web
        run: npm ci

      - name: Run Playwright
        working-directory: packages/tara-web
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/tara-web/test-results/
          retention-days: 7
